[project]
name = "statarb"
version = "0.1.0"
description = "Daily-frequency cross-sectional residual mean reversion in US equities, simulation only"
authors = [
    { name = "Tomas Crossland", email = "759011+tcrossland@users.noreply.github.com" }
]
license = "MIT"
requires-python = "==3.14.*"
# Each library enters with the phase whose code first imports it, its licence
# read from its own metadata and stated in that commit (docs/architecture.md).
dependencies = [
    "clarabel==0.11.1",             # the optimiser's solver, pinned with cvxpy for exact reproduction, phase 4
    "cvxpy==1.9.3",                 # the optimiser, phase 4
    "exchange-calendars>=4.13.3",   # New York sessions for the daily job, phase 6
    "lightgbm==4.7.0",              # the model, pinned exactly so a rebuilt model is byte-identical, phase 5
    "lxml>=6.1.3",                  # parsing the constituent list, phase 0
    "matplotlib>=3.11.2",           # report charts, phase 1
    "numpy>=2.5.4",                 # phase 0
    "pandas>=3",                    # long-format tables, phase 0
    "pyarrow>=26.0.1",              # parquet, phase 0; listed directly because the build must write byte-identical files
    "scipy==1.18.1",                # Model B's eigenvectors and the optimiser's sparse matrices, phase 4
]

[dependency-groups]
dev = [
    "pytest",
    "ruff==0.17.5",
]
explore = [
    "duckdb>=2.0.0",
    "marimo>=0.25.2",
]

[tool.marimo.display]
# The ledger explorer (notebooks/ledger.py) runs in dark. Its charts read this setting to pick their palette
# (`mo.app_meta().theme`), so "system" is not used: marimo reports it as light whatever the browser shows.
theme = "dark"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
# Strict config, markers, xfail and parametrisation ids.
strict = true
# Tests that take seconds each; `-m "not slow"` skips them before a commit (CLAUDE.md, "Testing").
markers = ["slow: runs with the full suite, before a push and in CI, not before every commit"]

[tool.ruff]
# Ruff's default rule set, with no exceptions so far; any added go under [tool.ruff.lint] with the reason.
# `src` makes the test helpers and scripts first-party.
src = ["src", "tests", "scripts"]
