# Rules and corrections for Alpaca's corporate actions (decision record 0004).
# Loaded by statarb.data.alpaca.parse_rules and applied by the build to the raw
# snapshot, so a change here needs a rebuild, not a download. Every value is
# from the issuer, its filings, the fund sponsor or the exchange, never from
# another price source.
#
# Withholding (rule 4). Alpaca flags dividends of foreign issuers `foreign`, but
# the flag does not say whether the amount is net of withholding tax: from 2023
# it nets some issuers' dividends and not others. Each [[net]] entry gives the
# ex-dates on which a ticker's amounts are net of `rate` (start and end
# inclusive, end left out while it continues), with any ex-dates in between
# that are gross, and cites the issuer's declared gross amounts. `gross` lists
# the tickers whose foreign-flagged dividends are gross throughout. A
# foreign-flagged dividend for a ticker in neither fails that ticker, so a new
# issuer is checked by hand. Amounts net of Irish dividend withholding tax are
# 75% of gross, of Dutch dividend tax 85%. Rates: Irish Revenue,
# https://www.revenue.ie/en/companies-and-charities/dividend-withholding-tax/index.aspx;
# Dutch Tax Administration,
# https://www.belastingdienst.nl/wps/wcm/connect/bldcontentnl/belastingdienst/zakelijk/winst/dividendbelasting/als_u_dividend_uitkeert
#
# Repeated dividends (rule 10). Records that differ only in how they were filed
# are kept once. Each [[repeat]] is a symbol and ex-date whose records are
# separate dividends, all kept.
#
gross = [
  "ACGL", "AMCR", "APTV", "BG", "CB", "CCL", "EG", "FERG", "GRMN", "IVZ",
  "JBL", "LIN", "LYB", "MRVL", "PFE", "PNR", "RCL", "SLB",
]

