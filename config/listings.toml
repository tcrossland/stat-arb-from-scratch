# The listing exchange of each ticker, for the auction measurement (docs/plans/auction-closes.md,
# decision record 0011). Loaded by statarb.data.listings. Measurement only: no build or frozen record
# reads this file.
#
# [current]: each ticker's exchange when this file was read, 2026-11-27. Stocks from SEC EDGAR's
# company_tickers_exchange.json (https://www.sec.gov/files/company_tickers_exchange.json, served with
# Last-Modified 2026-11-23), which names "NYSE" for every NYSE-group exchange; a stock it files as
# "NYSE" is entered under nyse, and the report's listing check tells NYSE from NYSE Arca and NYSE
# American. "CBOE" there is Cboe BZX. The ETFs from their prospectuses on EDGAR, which give NYSE Arca
# as the listing exchange: SPY, https://www.sec.gov/Archives/edgar/data/884394/000119312526022316/d77353d485bpos.htm
# (and the 2016 prospectus, https://www.sec.gov/Archives/edgar/data/884394/000119312516433722/d74633d485bpos.htm);
# the eleven Select Sector SPDR funds, https://www.sec.gov/Archives/edgar/data/1064641/000119312526027312/d15107d485bpos.htm
# (and 2016, https://www.sec.gov/Archives/edgar/data/1064641/000119312516442131/d118232d485bpos.htm;
# XLC's launch, https://www.sec.gov/Archives/edgar/data/1064641/000119312518194115/d802298d485bpos.htm).
# The SEC's website policy allows the information to be copied and redistributed, with a citation.
#
# [[transfer]]: each move between exchanges since 2016, walked back from the current exchange, with
# the first session on the new exchange and the issuer's filing or press release. Each was checked
# on 2026-11-27 against its source and against the issuer's Form 25 withdrawing from the old exchange.
# Not listed: moves before 2016 (CSX moved to Nasdaq on 2015-12-22), moves of a predecessor whose
# history the bar snapshot does not hold (SKYD's bars start on 2025-08-07), Chesapeake's suspension
# from NYSE in 2020 (EXE's bars start on 2021-02-10 under config/listing_starts.toml), and dual
# listings that left the primary listing unchanged.
#
# [[left_out]]: tickers the report leaves out, each with its reason. None yet.

