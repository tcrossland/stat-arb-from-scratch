# Listing starts for tickers whose source history begins before the company
# itself listed: another security that held the symbol, a pre-merger shell
# or when-issued trading (statarb.data.clean, rule 5). Rows before first_date
# are dropped and logged.
#
# This uses hindsight: the start is known only after the event. It is
# acceptable because it only removes rows that belong to a different security,
# and it must never be used to add or edit data (docs/time-discipline.md).
# Each entry cites a primary source.

