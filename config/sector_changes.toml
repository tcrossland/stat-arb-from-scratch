# GICS reclassifications applied on top of each ticker's current sector
# (statarb.data.sectors). One entry per ticker move. `effective` is the first
# trading day in the new sector.
#
# Scope: the three structural GICS changes since 2016, and the company-level
# moves of the candidates found in phase 1 (at the end of the file). For the
# structural changes, dates are S&P Dow Jones Indices' implementation in its
# indices, which the SPDR sector ETFs follow, rather than the GICS Direct date
# where the two differ.
#
# - 2016: Real Estate separated from Financials (mortgage REITs stayed).
#   GICS Direct after the close on 2016-08-31; S&P indices after the close on
#   2016-09-16, so effective 2016-09-19.
#   https://press.spglobal.com/2016-03-08-S-P-Dow-Jones-Indices-And-MSCI-Revisions-To-The-Global-Industry-Classification-Standard-GICS-Structure
# - 2018: Telecommunication Services broadened and renamed Communication
#   Services, taking media from Consumer Discretionary and interactive media
#   and home entertainment from Information Technology; online marketplaces
#   such as eBay moved to Consumer Discretionary. S&P indices after the close
#   on 2018-09-21 (GICS Direct 2018-09-28), so effective 2018-09-24.
#   https://press.spglobal.com/2017-11-15-S-P-Dow-Jones-Indices-And-MSCI-Announce-Revisions-To-The-Global-Industry-Classification-Standard-GICS-R-Structure-In-2018
#   https://press.spglobal.com/2018-01-11-S-P-Dow-Jones-Indices-And-MSCI-Announce-Select-List-Of-Companies-Changing-Due-To-Revisions-To-The-GICS-R-Structure-In-2018
# - 2023: payment processors to Financials, payroll and data processing to
#   Industrials, general merchandise stores to Consumer Staples. After the
#   close on 2023-03-17, so effective 2023-03-20. 14 S&P 500 members moved,
#   all listed below.
#   https://www.ssga.com/us/en/individual/etfs/insights/2023-gics-changes-companies-impacted-and-what-you-need-to-know
#
# Which tickers moved: S&P 500 members are taken from Wikipedia revisions
# either side of each change and checked against the announcements above.
# Wikipedia is not used for dates: it lagged the 2016 change by more than a
# month. Tickers that were not members at the time are included where their
# whole sub-industry moved, and say so in the note.
#
# Company-level moves were found by comparing the pinned Wikipedia revision
# with one at each year end since 2016, and each is dated from a primary
# source. A move no primary source dates stays on today's sector and is
# listed in the phase 1 review. Not covered: moves of a ticker before it
# entered the S&P 500, which the comparison cannot see, and tickers whose
# sector before a structural change is unknown.

